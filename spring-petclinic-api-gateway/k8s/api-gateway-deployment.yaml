apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-gateway
  namespace: petclinic

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
      - name: api-gateway

        image: 173235557364.dkr.ecr.eu-west-1.amazonaws.com/spring-petclinic/api-gateway:v1.0.0-prod
        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        env:
        - name: CONFIG_SERVER_URL
          value: http://config-server:8888

        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"

          limits:
            memory: "512Mi"
            cpu: "250m"

        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 20

